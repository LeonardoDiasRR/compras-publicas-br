[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-compras-publicas-br"
version = "0.1.0"
description = "MCP somente leitura para APIs públicas de compras brasileiras"
requires-python = ">=3.12"
dependencies = [
  "fastmcp==3.2.4",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6,<7",
  "tomlkit>=0.13,<1",
  "json5>=0.10,<1",
  "packaging>=24,<26",
]

[project.scripts]
mcp-compras-publicas-br = "src.features.plugin.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "pyright>=1.1.390,<2",
]

[tool.hatch.build.targets.wheel]
only-include = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live: consulta opt-in a produção; requer RUN_LIVE_TESTS=1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
