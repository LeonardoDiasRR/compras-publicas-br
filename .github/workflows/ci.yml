name: CI
on: [pull_request, push]
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run catalogo -- check coverage/endpoints.yaml
      - name: Verify read-only HTTP surface
        run: node -e "const s=require('fs').readFileSync('src/shared/http_readonly.ts','utf8').replace(/\/\*[\s\S]*?\*\//g,'').replace(/\/\/.*$/gm,''); if (/\.(post|put|patch|delete|request)\s*\(/.test(s)) { console.error('write-method found'); process.exit(1) }"
      - run: npm run build
