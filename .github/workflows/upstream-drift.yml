name: Upstream Drift
on:
  schedule:
    - cron: "17 5 * * 1-5"
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run catalogo -- discover --official --compare coverage/endpoints.yaml --fail-on-diff
